
name: restaurant_pos
description: "A professional, open-source Restaurant Point-of-Sale (POS) system built with Flutter. Supports Android tablets, Bluetooth thermal printing, multi-language (Arabic/English), and accent-color theming."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
