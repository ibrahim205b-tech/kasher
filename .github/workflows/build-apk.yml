
name: Build Restaurant POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: restaurant-pos-main/restaurant-pos-main
        run: flutter pub get

      - name: Build APK
        working-directory: restaurant-pos-main/restaurant-pos-main
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-pos-apk
          path: restaurant-pos-main/restaurant-pos-main/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
